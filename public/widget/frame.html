<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Intake chat</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --bot: #f1f5f9;
        --accent: #1d4ed8;
        --accent-fg: #ffffff;
        --err-bg: #fef2f2;
        --err-fg: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --line: #1e293b; --bot: #1e293b; --err-bg: #450a0a; --err-fg: #fecaca; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
      header strong { font-size: 14px; }
      header button { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
      #notice { padding: 8px 14px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
      #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
      .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
      .caller { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
      #error { display: none; margin: 0 14px 8px; padding: 8px 10px; border-radius: 8px; background: var(--err-bg); color: var(--err-fg); font-size: 13px; }
      footer { border-top: 1px solid var(--line); padding: 12px 14px; }
      .choices { display: flex; flex-wrap: wrap; gap: 8px; }
      .choices button, .primary { border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; }
      .choices button { background: transparent; color: var(--fg); border: 1px solid var(--line); }
      .primary { background: var(--accent); color: var(--accent-fg); border: 0; }
      form.stack { display: flex; flex-direction: column; gap: 8px; }
      form.row { display: flex; gap: 8px; }
      input, textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
      textarea { resize: none; }
      .muted { color: var(--muted); font-size: 13px; margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <strong id="title">Talk to our intake team</strong>
      <button type="button" id="close" aria-label="Close chat">&times;</button>
    </header>
    <div id="notice" role="note"></div>
    <div id="log" aria-live="polite"></div>
    <div id="error" role="alert"></div>
    <footer id="input"></footer>
    <script type="module" src="./frame.js"></script>
  </body>
</html>
